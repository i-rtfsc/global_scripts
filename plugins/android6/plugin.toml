name        = "android6"
version     = "6.0.0"
tier        = "script"
runtime     = "python"
entry       = "android6.py"
description  = { zh = "Android 开发与调试（全量 13 子插件 · GS 6.0 移植）", en = "Android dev & debugging (full 13-subplugin GS 6.0 port)" }
author      = "Solo"
homepage    = "https://github.com/i-rtfsc/global_scripts"
license     = "MIT"
category    = "development"
keywords    = ["android", "adb", "debugging", "mobile", "development"]
priority    = 20
protocol    = 1
describe_cache = "runtime"

# T2 plugins spawn their own subprocesses (the core doesn't gate those), so these
# are advisory/documentation:
#   exec  — adb (every command), emulator (emulator.*), open/xdg-open (winscope
#           HTML), python3 (winscope proxy).
#   fs    — the selected-device state file (shared with the legacy android
#           plugin), the user-cwd output files (screencap / perfetto / pull), and
#           read-only access to the sibling legacy plugin tree for heavy assets
#           (perfetto config.pbtx, Winscope HTML, frida .js) which are referenced
#           in place rather than copied.
[capabilities]
exec = ["adb", "emulator", "open", "xdg-open", "python3"]
fs   = ["rw:$HOME/.config/global-scripts", "write:$PROJECT", "read:$GS_ROOT/plugins/android"]
net  = false
env  = ["ANDROID_SERIAL", "ANDROID_HOME", "ANDROID_SDK_ROOT"]
