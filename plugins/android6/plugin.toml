name        = "android6"
version     = "6.0.0"
tier        = "script"
runtime     = "python"
entry       = "android6.py"
description  = { zh = "Android 开发与调试（device+logcat 子集 · GS 6.0 移植）", en = "Android dev & debugging (device+logcat subset · GS 6.0 port)" }
author      = "Solo"
homepage    = "https://github.com/i-rtfsc/global_scripts"
license     = "MIT"
category    = "development"
keywords    = ["android", "adb", "debugging", "mobile", "development"]
priority    = 20
protocol    = 1
describe_cache = "runtime"

# T2 plugins spawn their own subprocesses (the core doesn't gate those), so these
# are advisory/documentation: `exec` records that every command shells out to adb;
# `fs` covers the selected-device state file (shared with the legacy android
# plugin) and screencap's output file (resolved against the user's cwd).
[capabilities]
exec = ["adb"]
fs   = ["rw:$HOME/.config/global-scripts", "write:$PROJECT"]
net  = false
env  = ["ANDROID_SERIAL", "ANDROID_HOME", "ANDROID_SDK_ROOT"]
