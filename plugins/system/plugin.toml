name        = "system"
version     = "6.0.0-dev"
tier        = "script"
runtime     = "python"
entry       = "system.py"
description = { zh = "系统状态与提示符配置工具", en = "System status and prompt configuration utilities" }
author      = "Solo"
homepage    = "https://github.com/i-rtfsc/global_scripts"
license     = "MIT"
category    = "utility"
keywords    = ["system", "proxy", "homebrew", "repo", "prompt"]
priority    = 50
protocol    = 1
describe_cache = "runtime"

[capabilities]
exec = ["brew", "git"]
fs   = ["read:$GS_ROOT/themes/prompt", "rw:$HOME/.config/global-scripts/config", "rw:$PROJECT/config"]
net  = false
env  = ["HOME", "PATH", "GS_ROOT", "GS_CONFIG_FILE", "GS_PROMPT_THEME", "GS_SYSTEM_BREW_BIN", "GS_SYSTEM_GIT_BIN", "REPO_URL", "http_proxy", "https_proxy", "no_proxy", "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY", "HOMEBREW_BOTTLE_DOMAIN"]
