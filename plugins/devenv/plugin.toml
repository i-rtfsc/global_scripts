name        = "devenv"
version     = "6.0.0-dev"
tier        = "script"
runtime     = "python"
entry       = "devenv6.py"
description  = { zh = "开发环境检查、计划与显式安装", en = "Development environment checks, plans and explicit installs" }
author      = "Solo"
category    = "development"
priority    = 50
protocol    = 1
describe_cache = "runtime"

# T2 plugins run their own subprocesses (the core doesn't gate those), so these
# are advisory/documentation: `env` is the slice the core passes through to the
# plugin; `exec` records the package managers `install` shells out to. The
# per-tool `check` probes (e.g. `java -version`) also run as subprocesses.
[capabilities]
env  = ["PATH", "HOME", "GS_DEVENV_BREW_BIN", "GS_DEVENV_SKIP_CHECK", "GS_FAKE_LOG"]
exec = ["brew", "apt-get", "sudo", "sh", "bash"]
