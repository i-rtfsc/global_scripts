# 测试配置

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# 默认运行排除 performance 基准(时序阈值对机器/CI 敏感，且属 opt-in)。
# 按需运行: pytest tests/performance/ -m performance
addopts =
    -v
    --strict-markers
    -m "not performance"
    --tb=short
    --cov=src/gscripts
    --cov-report=term-missing
    --cov-report=html

# 测试标记
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance benchmark tests
    slow: Slow running tests (deselect with '-m "not slow"')
    asyncio: Async tests (handled by pytest-asyncio)
