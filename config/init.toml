# ---------------------------------------------------------------------------
# init.toml —— `gs init` 的步骤清单
# ---------------------------------------------------------------------------
# 能力在插件里,顺序在这里。每条 step:
#   id     有意义的步骤名(执行顺序就是这里的先后顺序)
#   group  分组,--group=/--without= 按它筛选
#   run    要执行的命令(插件名 + 子命令 + 参数),不带门禁标志
#   gate   该命令要求 --dry-run/--yes 时置 true,由 `gs init` 按自身模式追加
#   root   安装动作需要 root(gs 不会自己提权,只打印该执行的 sudo 命令)
#   desc   说明(zh/en)
#
# run 写成"今天就能跑"的命令;插件拆分/合并完成后只改 run 这一行。
# 不沿用 ~/new-system 的编号命名 —— 名字要能自解释。

[[steps]]
id = "inventory"
group = "inventory"
run = ["disk", "list"]
desc = { zh = "硬件与磁盘盘点(只读)", en = "Hardware and disk inventory" }

[[steps]]
id = "mirror-repo"
group = "mirror"
run = ["system", "repo", "tsinghua"]
gate = true
desc = { zh = "git-repo 走清华镜像", en = "Point git-repo at the Tsinghua mirror" }

[[steps]]
id = "mirror-brew"
group = "mirror"
run = ["system", "brew", "tsinghua"]
gate = true
desc = { zh = "Homebrew 走清华镜像", en = "Point Homebrew at the Tsinghua mirror" }

[[steps]]
id = "shell-config"
group = "config"
run = ["dotfiles", "install", "fish"]
gate = true
desc = { zh = "安装 fish 配置", en = "Install the fish configuration" }

[[steps]]
id = "base-tools"
group = "base"
run = ["devenv", "install", "essential"]
gate = true
root = true
desc = { zh = "基础 CLI 工具集", en = "Essential CLI tools" }

[[steps]]
