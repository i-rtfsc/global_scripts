name: Tests

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile plugin and SDK Python
        run: python -m compileall -q plugins sdk/python examples

      - name: Python plugin SDK self-test
        run: python sdk/python/selftest.py

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint the Rust workspace
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets

      - name: Run Rust core tests
        working-directory: rust
        run: cargo test --workspace

      - name: Check repository diff whitespace
        run: git diff --check

      - name: Verify the GS 6.0 front door
        run: |
          bash -n scripts/verify_gs.sh
          cargo build --manifest-path rust/Cargo.toml -p gs
          cargo build --release --manifest-path rust/Cargo.toml -p gs
          bash scripts/stage_release.sh
          bash scripts/verify_gs.sh

      - name: Audit the plugin surface
        run: python3 scripts/audit_plugins.py
