[package]
name = "gs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Global Scripts front door — fast CLI entry point."

[[bin]]
name = "gs"
path = "src/main.rs"

[dependencies]
gs-core = { path = "../gs-core" }
serde_json.workspace = true

# Reset SIGPIPE to default so `gs … | head` (and `source <(gs completions …)`)
# terminate quietly instead of panicking on a broken pipe. Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
