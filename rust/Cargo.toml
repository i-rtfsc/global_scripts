[workspace]
resolver = "2"
members = ["crates/gs-core", "crates/gs"]

[workspace.package]
version = "0.6.0-dev"
edition = "2021"
license = "MIT"
description = "Global Scripts 6.0 — Rust core (front door + daemon)"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: keep user JSON key order stable when we rewrite settings.json.
serde_json = { version = "1", features = ["preserve_order"] }
# plugin.toml manifests (GS 6.0 plugin protocol — docs/protocol.md §2).
toml = "0.8"
unicode-width = "0.2"
terminal_size = "0.4"
# Terminal presentation. tabled draws/aligns every table and panel (`ansi` keeps
# widths right when cells carry colour), anstyle/anstream own colour and the
# "is this a terminal" decision, indicatif reports long work, inquire drives
# pickers in front of a human.
tabled = { version = "0.17", features = ["derive", "ansi"] }
anstyle = "1"
anstream = "0.6"
indicatif = "0.17"
inquire = "0.7"
regex = "1"

# Launcher: optimize for a small, fast-starting binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
